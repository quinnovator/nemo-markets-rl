[project]
name = "nemo-markets-rl"
version = "1.0.0"
description = "Teaching a small model hidden pricing rules in a one-shot trade market, with GRPO on NVIDIA NeMo RL."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Jack Quinn" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Launching runs and fetching results from Modal. Training itself runs inside
# NVIDIA's NeMo RL container, so its dependencies are not listed here.
modal = ["modal>=1.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadline_offer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["deadline_offer"]
known-local-folder = ["market", "resident", "prepare", "deadline_grpo"]
